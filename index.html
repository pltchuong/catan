<html>
<head>
	<script type="module">

	function shuffle(array) {
		for (let i = array.length - 1; i >= 0; i--) {
			const j = Math.floor(Math.random() * (i + 1));
			[array[i], array[j]] = [array[j], array[i]];
		}
	}

	function combine(array1, array2) {
		return array1.flatMap(d => array2.map(v => `${d}_${v}`));
	}

	import zim from "https://zimjs.org/cdn/017/zim";

	const w = 200;
	const h = 174;
	const players = {
		"red": [LEFT, TOP],
		"blue": [RIGHT, TOP],
		"orange": [LEFT, BOTTOM],
		"green": [RIGHT, BOTTOM],
	};
	const scenarios = {
		"base": {
			"tiles": {
				"grain": 4,
				"lumber": 4,
				"wool": 4,
				"ore": 3,
				"brick": 3,
				"desert": 1,
			},
			"ports": {
				"grain": 1,
				"lumber": 1,
				"wool": 1,
				"ore": 1,
				"brick": 1,
				"generic": 4,
			},
			"chits": {
				 "2": 1,
				 "3": 2,
				 "4": 2,
				 "5": 2,
				 "6": 2,
				 "8": 2,
				 "9": 2,
				"10": 2,
				"11": 2,
				"12": 1,
			},
			"items": {
				"city": 4,
				"settlement": 5,
				"road": 15,
			},
			"board": [
				[2,2,2,0,0,0,0,2,2,2],
				 [2,2,0,1,1,1,0,2,2],
				[2,2,0,1,1,1,1,0,2,2],
				 [2,0,1,1,1,1,1,0,2],
				[2,2,0,1,1,1,1,0,2,2],
				 [2,2,0,1,1,1,0,2,2],
				[2,2,2,0,0,0,0,2,2,2],
			],
		}
	};

	const scenario = "base";
	const tiles = scenarios[scenario]["tiles"];
	const ports = scenarios[scenario]["ports"];
	const chits = scenarios[scenario]["chits"];
	const board = scenarios[scenario]["board"];
	const items = scenarios[scenario]["items"];

	const all_assets = Object.keys(tiles).map(t => `tile_${t}.svg`)
			   .concat(Object.keys(chits).map(t => `prob_${t}.svg`))
			   .concat(combine(Object.keys(items), Object.keys(players)).map(t => `${t}.svg`))
			   .concat(["icon_robber.svg", "icon_pirate.svg", "port_generic.svg"])
	;
	const all_tiles = Object.keys(tiles).map(key => Array(tiles[key]).fill(key)).flatMap(i => i);
	const all_chits = Object.keys(chits).map(key => Array(chits[key]).fill(key)).flatMap(i => i);
	const one_ports = Object.keys(ports).map(key => Array(ports[key]).fill(key)).flatMap(i => i);
	const two_ports = Array(board.flatMap(i => i).filter(i => i == 1).length - one_ports.length).fill();
	const all_ports = one_ports.concat(two_ports);

	const board_width  = w * Math.max(...board.map(edge=> edge.length));
	const board_height = h * board.length + 58;
	new Frame(
		FIT,
		board_width + 200,
		board_height + 58 + 50,
		"#328dc0",
		"#328dc0",
		ready,
		all_assets,
		"images/"
	);
	function ready() {

		shuffle(all_tiles);
		shuffle(all_chits);
		shuffle(all_ports);

		const container = new Container(board_width, board_height).center();

		let ti = 0;
		let pi = 0;
		let ci = 0;
		for (let r = 0; r < board.length; r++) {
			for (let c = 0; c < board[r].length; c++) {
				let tile = new Container().addTo(container).pos(w * c + (r % 2 == 0 ? 0 : w/2), h * r).setBounds(w, h + 58);
				if (board[r][c] == 1) {
					new Pic(`images/tile_${all_tiles[ti]}.svg`).siz(w).addTo(tile);
					if (all_tiles[ti] == "desert") {
						new Pic(`images/icon_robber.svg`).siz(80).pos(0, 30, CENTER, CENTER).addTo(tile).drag();
					} else {
						new Pic(`images/prob_${all_chits[ci]}.svg`).siz(50).pos(0, 30, CENTER, CENTER).addTo(tile).drag();
						ci++;
					}
					ti++;
				} else if (board[r][c] == 0) {
					new Pic(`images/tile_sea.svg`).siz(w).addTo(tile);
					if (all_ports[pi]) {
						new Pic(`images/port_${all_ports[pi]}.svg`).siz(100).center(tile).addTo(tile);
					}
					pi++;
				}
			}
		}

		Object.keys(players).forEach(player => {
			let position = players[player];
			Object.keys(items).forEach(item => {
				for (let i = 0; i < items[item]; i++) {
					new Pic(`images/${item}_${player}.svg`).sca(.7).pos(0, 0, position[0], position[1]).gesture({scale: false});
				}
			});
		});

	}
	</script>
</head>
<body>
</body>
</html>
