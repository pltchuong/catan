        for (let i = array.length - 1; i >= 0; i--) {

            [array[i], array[j]] = [array[j], array[i]];
        }

    function ready() {

        function setup_board() {
            let container = new Container(board_width, board_height).center();

            for (let r = 0; r < board.length; r++) {
                for (let c = 0; c < board[r].length; c++) {

                    let tile_x = w * c + (r % 2 == 0 ? 0 : w/2);
                    let tile_y = h * r;
                    let row = board[r];
                    let cell = row[c];

                    if (cell.length > 0) { // skip void tile

                        // Setup the main tile
                        let tile = cell[0];
                        let tile_zim = new Pic(`images/tile_${tile}.svg`).nam(tile).siz(w).pos(tile_x, tile_y).addTo(container);

                        // Sea tiles might have a port attached to it. The
                        // position of the dock is relative to the sea tile.
                        // The order of surrounding tiles is always the same:
                        // 0 - top left
                        // 1 - top right
                        // 2 - right
                        // 3 - bottom right
                        // 4 - bottom left
                        // 5 - left
                        if (tile == 'sea' && cell.length > 2) {
                            let port = cell[1];
                            let path = cell[2];
                            new Pic(`images/port_${port}.svg`).siz(100).pos(tile_x + 40, tile_y + 50).addTo(container);

                            let ax = 0;
                            let ay = 0;
                            let bx = 0;
                            let by = 0;
                            if (path == 0) {
                                ax = 35;
                                ay = 50;
                                bx = 90;
                                by = 10;
                            } else if (path == 1) {
                                ax = 97;
                                ay = 20;
                                bx = 160;
                                by = 60;
                            } else if (path == 2) {
                                ax = 160;
                                ay = 60;
                                bx = 160;
                                by = 135;
                            } else if (path == 3) {
                                ax = 160;
                                ay = 135;
                                bx = 90;
                                by = 170;
                            } else if (path == 4) {
                                ax = 90;
                                ay = 170;
                                bx = 20;
                                by = 135;
                            } else if (path == 5) {
                                ax = 20;
                                ay = 135;
                                bx = 20;
                                by = 60;
                            }
                            new Pic(`images/icon_dock.svg`).centerReg().sca(.2).pos(tile_x + ax, tile_y + ay).rot((path-1+0) * 60).addTo(container);
                            new Pic(`images/icon_dock.svg`).centerReg().sca(.2).pos(tile_x + bx, tile_y + by).rot((path-1+1) * 60).addTo(container);

                        // Foggy tiles are clickable and reveal random tile and
                        // random chits (if available). The chits must behave
                        // just like any other chits on the board.
                        } else if (tile == 'fog') {
                            tile_zim.on("click", () => {
                                tile_zim.removeFrom();

                                let foggy_tile = foggy_tiles.pop();
                                let foggy_tile_zim = new SVG(`images/tile_${foggy_tile}.svg`).addTo(container).siz(w).pos(tile_x, tile_y);

                                if (foggy_tile != 'sea' && foggy_tile != 'desert') {
                                    let foggy_chit = foggy_chits.pop();
                                    let foggy_chit_zim = new SVG(`images/prob_${foggy_chit}.svg`).addTo(container).centerReg().sca(.4).pos(tile_x + 75, tile_y + 120);
                                    chits_zim[foggy_chit].push(foggy_chit_zim);
                                }

                                S.update();
                            });

                        // Most of land tiles has a chit/token attached to it.
                        // The chit/token must be a number to match with dice's
                        // numbers.
                        } else if (typeof cell[1] === "number") {
                            let chit = cell[1];
                            if (chit) {
                                let chit_zim = new Pic(`images/prob_${chit}.svg`).centerReg().sca(.4).pos(tile_x + 75, tile_y + 120).addTo(container).drag();
                                if (Object.keys(chits_zim).includes(chit.toString())) {
                                    chits_zim[chit].push(chit_zim);
                                } else {
                                    chits_zim[chit] = [chit_zim];
                                }
                            }

                        // Some land tiles has some additional extra items
                        // attached to it. The extra items are pipe-separated.
                        // Each extra items has a number next to it indicating
                        // the available quantity of the item. Supporting items
                        // are:
                        // d - Extra development card
                        // p - Pirate
                        // r - Robber
                        // v - Extra victory chit token
                        } else if (typeof cell[1] === "string" && cell[1].startsWith('extra')) {
                            let extra_items = cell[1].split('=')[1].split('|');
                            for (let item of extra_items) {
                                let name = item[0];

                                if (name == 'r') {
                                    let robber_zim = new Pic(`images/icon_robber.svg`).centerReg().sca(.4).pos(tile_x + 60, tile_y + 100).addTo(container).drag();
                                    chits_zim[7].push(robber_zim);
                                } else if (name == 'p') {
                                    let pirate_zim = new Pic(`images/icon_pirate.svg`).centerReg().siz(70).pos(tile_x + 70, tile_y + 70).addTo(container).drag();
                                    chits_zim[7].push(pirate_zim);
                                } else {
                                    let qty = parseInt(item.substr(1));
                                    for (let i = 0; i < qty; i++) {
                                        let circle = new Circle({radius: 30, borderWidth: 2, borderColor: white}).addTo(container).drag();
                                        let label = new Label({text: 1, size: 24, color: white}).addTo(circle).center();

                                        if (name == 'v') {
                                            circle.dye(red).pos(tile_x + 120, tile_y + 60 - i*3);
                                        } else if (name == 'd') {
                                            circle.dye(blue).pos(tile_x + 120, tile_y + 120 - i*3);
                                        }
                                    }
                                }
                            }
                        }
                    }
                }
            }
        }

        function setup_players() {
            Object.keys(players.colors).forEach(color => {
                let position = players.colors[color];
                Object.keys(players.items).forEach(item => {
                    let item_obj = players.items[item];
                    for (let i = 0; i < item_obj.count; i++) {
                        let item_zim;
                        if (item != "ship" || (item == "ship" && scenarios[scenario].has_ship)) {
                            item_zim = new Pic(`images/${item}_${color}.svg`)
                                .centerReg()
                                .sca(.7)
                                .pos(item_obj.width * i, item_obj.height, position[0], position[1])
                                .drag()
                            ;
                        }
                        if (item == "road") {
                            let start_x, start_y;
                            item_zim.on("mousedown", () => {
                                start_x = item_zim.x;
                                start_y = item_zim.y;
                            });
                            item_zim.on("pressup", () => {
                                // check if this is click event, not drag event
                                if (start_x == item_zim.x && start_y == item_zim.y) {
                                    item_zim.animate({props: {rotation: "60"}, time:.1, ease: "linear"});
                                }
                            });
                        }
                    }
                });
            });
        }

        function setup_dices() {
            new Label("Dice").siz(100).pos(20, 450, RIGHT, TOP).on("click", function(e) {
                // reset scale of all highlighted items
                for (let chit_num in chits_zim) {
                    for (let chit_zim of chits_zim[chit_num]) {
                        chit_zim.animate({props: {scale: .4}, time:.1, ease: "linear"});
                    }
                }
                rollADie({
                    element: document.getElementById("dice"), // element to display the animated dice in.
                    numberOfDice: 2,
                    soundVolume: 0,
                    delay: 1000000000,
                    callback: res => {
                        let dice = res[0] + res[1];
                        if (Object.keys(chits_zim).includes(dice.toString())) {
                            for (let chit_zim of chits_zim[dice]) {
                                chit_zim.animate({props: {scale: .7}, time:.1, ease: "linear"});
                            }
                        }
                    },
                });
            });
        }

        function shuffle_board(shuffle_tiles = false, shuffle_chits = false, shuffle_ports = false) {

            // collect all data from the board
            let all_tiles = [];
            let all_ports = [];
            let all_chits = [];
            for (let r = 0; r < board.length; r++) {
                for (let c = 0; c < board[r].length; c++) {
                    let row = board[r];
                    let cell = row[c];

                    if (cell.length > 0) { // skip void tile
                        let tile = cell[0];
                        if (tile == 'sea' && cell.length > 2) {
                            let port = cell[1];
                            all_ports.push(port);
                        }
                        if (!FIXED_TILES.includes(tile)) {
                            let chit = cell[1];
                            all_tiles.push(tile);
                            all_chits.push(chit);
                        }
                    }
                }
            }

            // shuffle items if needed
            if (shuffle_tiles) {
                shuffle(all_tiles);
            }
            if (shuffle_chits) {
                shuffle(all_chits);
            }
            if (shuffle_ports) {
                shuffle(all_ports);
            }

            // redistribute items back to the board
            let ti = 0;
            let pi = 0;
            for (let r = 0; r < board.length; r++) {
                for (let c = 0; c < board[r].length; c++) {
                    let row = board[r];
                    let cell = row[c];

                    if (cell.length > 0) { // skip void tile
                        let tile = cell[0];
                        if (tile == 'sea' && cell.length > 2) {
                            board[r][c] = [tile, all_ports[pi], board[r][c][2]];
                            pi++;
                        }
                        if (!FIXED_TILES.includes(tile)) {
                            board[r][c] = [all_tiles[ti], all_chits[ti]];
                            ti++;
                        }
                    }
                }
            }
        }

        shuffle_board(param("shuffle_tiles", false), param("shuffle_chits", false), param("shuffle_ports", false));
        setup_board();
        setup_players();
        setup_dices();
    }
    </script>
</head>
<body>
    <div style="position: absolute; top: 40%; left: 85%; z-index: 10;" id="dice"></div>
